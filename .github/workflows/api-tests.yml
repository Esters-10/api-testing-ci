name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check GOREST_TOKEN is configured
        run: |
          if [ -z "${GOREST_TOKEN}" ]; then
            echo "GOREST_TOKEN is missing. Add the GitHub Actions secret before running tests."
            exit 1
          fi

      - name: Run smoke tests
        run: pytest -m smoke -q --junitxml=smoke-report.xml

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.xml

  full-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check GOREST_TOKEN is configured
        run: |
          if [ -z "${GOREST_TOKEN}" ]; then
            echo "GOREST_TOKEN is missing. Add the GitHub Actions secret before running tests."
            exit 1
          fi

      - name: Run full regression suite
        run: pytest -q --junitxml=report.xml

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: report.xml
